
{% load static %}


<nav class="navbar navbar-expand-lg navbar-dark border-bottom" 
     style="background-color: rgba(0, 0, 0, 0.4); height: 120px;">

  <div class="container">

    <!-- LOGO -->
    <a class="navbar-brand" href="#">
      <img src="{% static 'images/techverso_transparente.png' %}" alt="Techverso" style="height: 150px;">
    </a>

    <!-- BOTÃO RESPONSIVO -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- LINKS -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'index' %}" style="font-size: 25px;">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'cursos' %}" style="font-size: 25px;">Cursos</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'vagas' %}" style="font-size: 25px;">Vagas</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'calculadora' %}" style="font-size: 25px;">Calculadora</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'faq' %}" style="font-size: 25px;">FAQ</a></li>
      </ul>

      <!-- ÍCONES DE REDES SOCIAIS -->
      <ul class="navbar-nav social-icons">
        <li class="nav-item">
          <a href="https://chat.whatsapp.com/JONCTfNFkn50vZR04NNw2Y" target="_blank" class="nav-link glass-icon whatsapp">
            <i class="fab fa-whatsapp"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="https://www.youtube.com/@TechVersoTV" target="_blank" class="nav-link glass-icon youtube">
            <i class="fab fa-youtube"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="https://github.com/UNIVESP23" target="_blank" class="nav-link glass-icon github">
            <i class="fab fa-github"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="https://t.me/techversobr" target="_blank" class="nav-link glass-icon telegram">
            <i class="fab fa-telegram"></i>
          </a>
        </li>
        <li class="nav-item">
          <a href="https://www.linkedin.com/in/techverso/" target="_blank" class="nav-link glass-icon linkedin">
            <i class="fab fa-linkedin"></i>
          </a>
        </li>
      </ul>

      <!-- LOGIN / LOGOUT -->
      <div class="d-flex align-items-center ms-3">
        {% if user.is_authenticated %}
        <span class="nav-text text-white me-2">{{ user.username }}</span>
        <form method="POST" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn glass-btn" type="submit">Sair</button>
        </form>
        {% else %}
        <a class="btn glass-btn me-2" href="{% url 'login' %}">Entrar</a>
        <a class="btn glass-btn" href="{% url 'register' %}">Registrar</a>
        {% endif %}
      </div>

    </div>
